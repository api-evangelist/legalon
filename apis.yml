aid: legalon
name: LegalOn
description: 'LegalOn Technologies is a legal-technology company building AI software for in-house legal
  teams, corporate legal operations, and law firms. Its platform covers AI contract review and redlining,
  contract playbooks, matter management, a contract data vault, translation, entity and board management,
  and agentic legal workflows, with a Microsoft Word integration for reviewing agreements in place. Founded
  in Japan as LegalForce and now operating in both Japan (legalontech.jp) and the United States
  (legalontech.com), the company runs a sibling product family for governance (GovernOn), sales (DealOn),
  HR (WorkOn), and marketing compliance (DocumentOn). LegalOn publishes a REST API for contract files and
  contract metadata — upload, retrieve, update and delete contract documents, register and update contract
  information such as counterparties and contract types, link related documents, and list registered
  contracts — authenticated with OAuth 2.0 client credentials, intended for integration with contract
  management systems, CRM, and BI tooling. The API is announced publicly but its reference documentation
  is not published on the open web; access is arranged through the vendor. The company is backed by
  Hongshan and the SoftBank Vision Fund, and publishes SOC 2 Type II, ISO/IEC 27001:2022 and ISO/IEC
  27017:2015 certifications through a public trust center.'
