apis:
- aid: legalon:contract-api
  name: LegalOn Contract API
  description: 'REST API for the LegalOn contract platform. Documented capabilities cover contract file
    operations (upload, retrieve, update, delete), contract information management (register and update
    metadata such as counterparty name and contract type), linking related documents to a contract, and
    retrieving lists and details of registered contracts. Authentication is OAuth 2.0 using the
    client_credentials grant, scoped to workspaces where the caller holds the appropriate role. Announced
    publicly on 2026-07-13 as the second phase of LegalOn API connectivity; the API reference is not
    published on the open web.'
